<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Alumnos</title>
    <link rel="stylesheet" href="alumnos.css">
</head>

<body>
    <main>
        <h1>Registro de Alumnos</h1>
        <form id="formulario">

            <label for="nombre">Nombre</label>

            <input type="text"
                   id="nombre"
                   placeholder="Escribe el nombre"
                   required>

            <label for="apellidoP">Apellido Parterno</label>

            <input type="text"
                   id="apellidoP"
                   placeholder="Escribe el apellido paterno"
                   required>

            <label for="nombre">Apellido Materno</label>

            <input type="text"
                   id="apellidoM"
                   placeholder="Escribe el apellido materno"
                   required>

            <label for="carrera">Calificacion Matematicas</label>

            <input type="number"
                   id="materia1"
                   min="0"
                   max="10"
                   placeholder="Escribe la calificacion"
                   required>

            <label for="numcontrol">Calificacion Español</label>

            <input type="number"
                   id="materia2"
                   min="0"
                   max="10"
                   placeholder="Escribe la calificacion"
                   required>

            <label for="numcontrol">Calificacion Historia</label>

            <input type="number"
                   id="materia3"
                   min="0"
                   max="10"
                   placeholder="Escribe la calificacion"
                   required>
            <button type="submit">
                Guardar
            </button>
        </form>
        <h2>Alumnos registrados</h2>
        <div id="lista"></div>

    </main>

    <script src="alumnos.js"></script>

</body>
</html>
